<script>
// ── State ──
var lang = 'en';
var activeQ = [], idx = 0, score = 0, logs = [];
var currentDiff = 'easy';
var playerName = '';

// ── Finnish name generator ──
var FI_ADJECTIVES = ['Brave','Bold','Quiet','Fierce','Calm','Swift','Frost','Dark','Wild','Lone',
    'Silent','Mighty','Ancient','Frozen','Mystic','Sturdy','Noble','Fearless','Iron','Golden'];
var FI_NOUNS = ['Poro','Karhu','Susi','Kotka','Hirvi','Kettu','Orava','Joutsen','Hauki','Ahma',
    'Ilves','Majava','Peura','Siili','Pöllö','Hanhi','Lohi','Kuha','Naali','Saukko'];

function randomFinnishName() {
    var adj  = FI_ADJECTIVES[Math.floor(Math.random() * FI_ADJECTIVES.length)];
    var noun = FI_NOUNS[Math.floor(Math.random() * FI_NOUNS.length)];
    return adj + ' ' + noun;
}

// ── Leaderboard storage (localStorage) ──
var LB_KEY_TOP    = 'suomi_lb_top';
var LB_KEY_RECENT = 'suomi_lb_recent';

function lbLoad(key) {
    try { return JSON.parse(localStorage.getItem(key)) || []; }
    catch(e) { return []; }
}

function lbSave(key, data) {
    try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {}
}

function lbRecord(name, score, diff) {
    var ts = Date.now();
    var entry = { name: name, score: score, diff: diff, ts: ts };

    // Top 10: sorted by score desc, keep best 10
    var top = lbLoad(LB_KEY_TOP);
    top.push(entry);
    top.sort(function(a,b){ return b.score - a.score || b.ts - a.ts; });
    top = top.slice(0, 10);
    lbSave(LB_KEY_TOP, top);

    // Recent 20: newest first
    var recent = lbLoad(LB_KEY_RECENT);
    recent.unshift(entry);
    recent = recent.slice(0, 20);
    lbSave(LB_KEY_RECENT, recent);
}

function diffLabel(d) {
    var map = { easy: '🦌', medium: '🌲', hard: '❄️' };
    return map[d] || d;
}

function renderLeaderboard() {
    var top    = lbLoad(LB_KEY_TOP);
    var recent = lbLoad(LB_KEY_RECENT);

    // ── Top 10 ──
    var topEl = document.getElementById('lb-top');
    if (!top.length) {
        topEl.innerHTML = '<div class="lb-empty">No scores yet — be the first!</div>';
    } else {
        topEl.innerHTML = top.map(function(e, i) {
            var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1)+'.';
            var isMe  = (e.name === playerName && e.score === score);
            return '<div class="lb-row' + (isMe ? ' lb-me' : '') + '">'
                + '<span class="lb-rank">' + medal + '</span>'
                + '<span class="lb-name">' + e.name + '</span>'
                + '<span class="lb-diff">' + diffLabel(e.diff) + '</span>'
                + '<span class="lb-score">' + e.score + '/10</span>'
                + '</div>';
        }).join('');
    }

    // ── Recent 20 ──
    var recEl = document.getElementById('lb-recent');
    if (!recent.length) {
        recEl.innerHTML = '<div class="lb-empty">No games played yet!</div>';
    } else {
        recEl.innerHTML = recent.map(function(e) {
            var d   = new Date(e.ts);
            var time = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            var isMe = (e.name === playerName && e.score === score);
            return '<div class="lb-row' + (isMe ? ' lb-me' : '') + '">'
                + '<span class="lb-name">' + e.name + '</span>'
                + '<span class="lb-diff">' + diffLabel(e.diff) + '</span>'
                + '<span class="lb-score">' + e.score + '/10</span>'
                + '<span class="lb-time">' + time + '</span>'
                + '</div>';
        }).join('');
    }
}

function showTab(tab) {
    document.getElementById('lb-top').classList.toggle('hidden', tab !== 'top');
    document.getElementById('lb-recent').classList.toggle('hidden', tab !== 'recent');
    document.getElementById('tab-top').classList.toggle('active', tab === 'top');
    document.getElementById('tab-recent').classList.toggle('active', tab === 'recent');
}

// ── Grade labels & messages ──
var GRADES = {
    en: {
        sisu:  { badge: 'Sisu Master',    msg: 'Flawless. You are practically Finnish.' },
        great: { badge: 'Awesome',        msg: 'Well done! You have a great grasp of the culture.' },
        ok:    { badge: 'Forest Wanderer',msg: "You're getting there. A bit more study is needed." },
        poro:  { badge: 'Poro Level',     msg: "Don't worry, the tundra is a big place. Try again." }
    },
    fi: {
        sisu:  { badge: 'Sisu-mestari',   msg: 'Täydellinen! Olet käytännössä suomalainen.' },
        great: { badge: 'Loistava',       msg: 'Hienoa! Sinulla on hyvä käsitys kulttuurista.' },
        ok:    { badge: 'Metsän kulkija', msg: 'Olet matkalla. Tarvitset hieman lisää opiskelua.' },
        poro:  { badge: 'Porotaso',       msg: 'Älä huoli, tunturi on suuri paikka. Yritä uudelleen!' }
    }
};

var DIFF_LABELS = {
    en: { choose:'choose difficulty', easy:'🦌 &nbsp; Easy — Poro', medium:'🌲 &nbsp; Medium — Forest', hard:'❄️ &nbsp; Hard — Sisu', restart:'↺ &nbsp; Restart Challenge', correct:'Correct:' },
    fi: { choose:'valitse vaikeustaso', easy:'🦌 &nbsp; Helppo — Poro', medium:'🌲 &nbsp; Keskitaso — Metsä', hard:'❄️ &nbsp; Vaikea — Sisu', restart:'↺ &nbsp; Aloita uudelleen', correct:'Oikea:' }
};

// ── Helpers ──
function shuffle(a) {
    for (var i = a.length-1; i > 0; i--) {
        var j = Math.floor(Math.random()*(i+1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
    }
}

// ── Language ──
function applyLangToUI() {
    var isFi = (lang === 'fi');
    document.getElementById('lbl-en').classList.toggle('lang-active', !isFi);
    document.getElementById('lbl-fi').classList.toggle('lang-active', isFi);
    document.getElementById('lang-toggle').checked = isFi;
    document.querySelectorAll('[data-en]').forEach(function(el) {
        el.innerHTML = el.getAttribute('data-' + lang);
    });
}

function setLang(isFi) {
    lang = isFi ? 'fi' : 'en';
    applyLangToUI();
}

// ── Restart ──
function restart() {
    activeQ = []; idx = 0; score = 0; logs = []; playerName = '';
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('review-list').innerHTML = '';
    document.getElementById('start-screen').classList.remove('hidden');
    applyLangToUI();
}

// ── Quiz ──
function init(lvl) {
    currentDiff = lvl;
    activeQ = QUESTIONS_DB[lvl].slice();
    shuffle(activeQ);
    activeQ = activeQ.slice(0, 10);
    idx = 0; score = 0; logs = [];
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    render();
}

function render() {
    var raw = activeQ[idx];
    var qText      = raw.q[lang];
    var answers    = raw.a[lang];
    var correctAns = answers[raw.c];

    document.getElementById('progress-fill').style.width = ((idx+1)/10*100) + '%';
    document.getElementById('q-text').innerText = qText;

    var choices = answers.slice();
    shuffle(choices);

    var optDiv = document.getElementById('options');
    optDiv.innerHTML = '';
    choices.forEach(function(c) {
        var btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = c;
        btn.onclick = function() {
            var isWin = (c === correctAns);
            if (isWin) score++;
            logs.push({ q: qText, user: c, correct: correctAns, win: isWin });
            idx++;
            if (idx < 10) render(); else finish();
        };
        optDiv.appendChild(btn);
    });
}

function finish() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');

    var badge = document.getElementById('grade-badge');
    var msg   = document.getElementById('grade-msg');
    var pct   = (score / 10) * 100;
    var g = GRADES[lang], d = DIFF_LABELS[lang];
    if      (pct >= 90) { badge.innerText = g.sisu.badge;  msg.innerText = g.sisu.msg; }
    else if (pct >= 70) { badge.innerText = g.great.badge; msg.innerText = g.great.msg; }
    else if (pct >= 40) { badge.innerText = g.ok.badge;    msg.innerText = g.ok.msg; }
    else                { badge.innerText = g.poro.badge;  msg.innerText = g.poro.msg; }

    document.getElementById('score-title').innerText = score + '/10';

    // Generate player name & save to leaderboard
    playerName = randomFinnishName();
    lbRecord(playerName, score, currentDiff);

    // Show player name banner
    var banner = document.getElementById('player-name-banner');
    banner.innerHTML = '🎲 Playing as <strong>' + playerName + '</strong>';

    // Render leaderboard (default tab: top)
    showTab('top');
    renderLeaderboard();

    // Review list
    var list = document.getElementById('review-list');
    list.innerHTML = '';
    logs.forEach(function(l) {
        list.innerHTML += '<div class="review-item">'
            + '<div style="margin-bottom:4px;font-weight:500;">' + l.q + '</div>'
            + '<div class="' + (l.win ? 'correct-ans' : 'wrong-ans') + '">' + (l.win ? '✓' : '✗') + ' ' + l.user + '</div>'
            + (!l.win ? '<div class="correct-label">' + d.correct + ' ' + l.correct + '</div>' : '')
            + '</div>';
    });

    document.querySelector('#result-screen .restart-btn').innerHTML = d.restart;
}
</script>
</body>
</html>
